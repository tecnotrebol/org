<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECNO TREBOL - Servicio No Disponible</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .floating-icon {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-white relative overflow-x-hidden">

    <!-- Background decorative gradients -->
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header -->
    <header class="w-full py-6 px-8 flex justify-center items-center z-10 border-b border-slate-900/50 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-900/30">
                <i class="fa-solid fa-bolt text-white text-lg"></i>
            </div>
            <span class="text-xl font-bold tracking-wider bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                TECNO TREBOL
            </span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center px-4 py-12 z-10">
        <div class="max-w-lg w-full bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-3xl p-8 sm:p-10 shadow-2xl text-center relative">
            
            <!-- Warning Floating Icon -->
            <div class="floating-icon mx-auto w-20 h-20 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center mb-6 text-emerald-400 text-3xl shadow-inner">
                <i class="fa-solid fa-screwdriver-wrench"></i>
            </div>

            <!-- Status Badge -->
            <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs font-medium mb-4">
                <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                Actualización Temporal
            </div>

            <!-- Main Heading -->
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white mb-4">
                Sitio en Mantenimiento
            </h1>

            <!-- Exact Requested Notice Message -->
            <p class="text-slate-300 text-base sm:text-lg leading-relaxed mb-8">
                En este momento no se encuentra disponible para esta página. Comuníquese por sus redes sociales o vía WhatsApp.
            </p>

            <!-- Action Buttons Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- WhatsApp Button with provided direct link -->
                <a href="https://api.whatsapp.com/send/?phone=584244649564&text&type=phone_number&app_absent=0" 
                   target="_blank" 
                   rel="noopener noreferrer"
                   class="flex items-center justify-center gap-3 py-3.5 px-5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold transition-all duration-300 shadow-lg shadow-emerald-600/20 active:scale-95 group">
                    <i class="fa-brands fa-whatsapp text-xl group-hover:scale-110 transition-transform"></i>
                    <span>WhatsApp</span>
                </a>

                <!-- Social Networks Button linked to Beacons -->
                <a href="https://beacons.ai/tecnotrebol" 
                   target="_blank" 
                   rel="noopener noreferrer"
                   class="flex items-center justify-center gap-3 py-3.5 px-5 rounded-2xl bg-slate-800 hover:bg-slate-700 border border-slate-700/80 text-white font-semibold transition-all duration-300 shadow-lg active:scale-95 group">
                    <i class="fa-solid fa-share-nodes text-emerald-400 text-lg group-hover:scale-110 transition-transform"></i>
                    <span>Redes Sociales</span>
                </a>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-6 text-center text-xs text-slate-500 z-10 border-t border-slate-900/50">
        <p>&copy; 2026 GABOX_LOPEZ. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
